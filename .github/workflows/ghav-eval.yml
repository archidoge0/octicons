            ~/.npm
      - name: Record cache state
        run: echo "GHAV_CACHE_HIT=${{ steps.tool-cache.outputs.cache-hit }}"
      - name: Install pinned tools
        run: |
          python -m pip install --disable-pip-version-check picosvg==0.20.6 lxml==6.1.3 skia-pathops==0.8.0.post2 absl-py==2.3.1
          npm exec --yes --package=svgo@3.3.3 -- svgo --version
